name: Terraform Init Plan And Apply

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  Terraforminitandplan:
    name: Terraform Init
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: 
          tenant-id: 
          subscription-id: 2fe6adb6-b639-4804-8d25-87b437c9cbe6
          
      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: environments/dev
  
      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
        working-directory: environments/dev
  
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: environments/dev
  
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true
        working-directory: environments/dev

  Terraform-Apply:
    name: Terraform-apply
    needs: Terraforminitandplan
    runs-on: self hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: 
          tenant-id: 
          subscription-id: 

      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: environments/dev

      - name: Terraform Apply
        id: Apply
        run: terraform apply --auto-approve
        continue-on-error: true
        working-directory: environments/dev
